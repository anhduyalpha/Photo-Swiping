name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Expo Prebuild
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Create assets directory
        working-directory: artifacts/mobile
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JavaScript
        working-directory: artifacts/mobile
        run: |
          pnpm exec react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make gradlew executable
        working-directory: artifacts/mobile/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease -x createBundleReleaseJsAndAssets --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Rename APK
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          cp artifacts/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk \
             CleanSnap-${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanSnap-APK
          path: CleanSnap-*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: CleanSnap ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## CleanSnap Android APK

            **Smart Photo Cleaner** — AI-powered duplicate, blur & screenshot detection.

            ### Install
            1. Download `CleanSnap-*.apk` below
            2. On your Android phone: Settings → Security → enable **Install from unknown sources**
            3. Open the downloaded APK to install

            ### What's in this release
            - AI duplicate/burst photo detection
            - Blurry photo detection
            - Screenshot detection
            - Swipe mode for manual review
            - Bulk delete with one tap
          files: CleanSnap-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
